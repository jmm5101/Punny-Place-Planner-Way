<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Punny Place Planner Way</title>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--grass:#3d7a3a;--asphalt:#1c1c1c;--sign-blue:#1a5fb4;--ui-bg:#121212;--accent:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Overpass',system-ui,sans-serif;background:#0a0a0a;color:#eee;overflow:hidden}
body{display:flex;flex-direction:column}
header{background:var(--ui-bg);border-bottom:2px solid #333;padding:8px 10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;z-index:40}
.logo-wrap{display:flex;flex-direction:column;align-items:center}
.logo-signs{display:flex;flex-direction:column;gap:2px;z-index:2}
.logo-sign{background:linear-gradient(to bottom,#1a5fb4,#0d3d7a);color:#fff;font-weight:800;font-size:.7rem;letter-spacing:.8px;text-transform:uppercase;padding:3px 10px;border:1.5px solid #c9a800;border-radius:2px;white-space:nowrap;box-shadow:0 1px 0 #062a5a;line-height:1.15}
.logo-sign.top{transform:rotate(-1.5deg)}
.logo-sign.bottom{transform:rotate(1deg);margin-left:5px}
.logo-pole{width:10px;height:18px;background:linear-gradient(to right,#6a6a6a,#9a9a9a 45%,#7a7a7a);border-radius:0 0 2px 2px;margin-top:1px;z-index:1}
.version{font-size:.55rem;color:#666;margin-top:2px}
.level-tabs{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.level-tabs button{font-family:inherit;font-weight:600;font-size:.68rem;padding:4px 9px;border:1.5px solid #444;background:#1a1a1a;color:#bbb;cursor:pointer;border-radius:3px;white-space:nowrap}
.level-tabs button.active{background:var(--accent);border-color:#2e7d32;color:#000}
.level-tabs button.disabled{background:#2a2a2a;border-color:#333;color:#666;cursor:not-allowed;opacity:.65}
.plan-row{display:flex;align-items:center;gap:6px;width:100%;max-width:320px;justify-content:center}
.plan-row label{font-size:.65rem;color:#888;white-space:nowrap}
.plan-row input{flex:1;font-family:inherit;font-size:.75rem;padding:3px 6px;border:1.5px solid #444;background:#1a1a1a;color:#eee;border-radius:3px;min-width:0}
.status{font-size:.6rem;color:#777;text-align:center}
#game-container{flex:1;position:relative;overflow:hidden;background:#1a3a1a;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;cursor:crosshair;background:var(--grass)}
.modal-overlay,.sign-overlay{position:absolute;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal-overlay.open,.sign-overlay.open{display:flex}
.modal{background:#222;border:2px solid #444;border-radius:8px;padding:14px 16px;width:min(340px,100%)}
.modal h2{font-size:.95rem;margin-bottom:10px}
.modal label{display:block;font-size:.7rem;color:#999;margin-bottom:2px}
.modal input,.modal select{width:100%;font-family:inherit;font-size:.9rem;padding:7px 8px;margin-bottom:8px;border:2px solid #555;background:#111;color:#fff;border-radius:4px}
.modal-actions{display:flex;gap:8px;margin-top:4px}
.modal-actions button{font-family:inherit;font-weight:700;font-size:.8rem;padding:7px 12px;border:none;border-radius:4px;cursor:pointer}
.btn-primary{background:var(--accent);color:#000}
.btn-secondary{background:#444;color:#eee}
.sign-stage{position:relative;width:min(280px,92vw);height:340px;background:linear-gradient(to bottom,#6bb3e8 0%,#4a9ad4 45%,#3a7bb0 100%);border:3px solid #222;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding-top:28px}
.pole{position:absolute;bottom:0;width:22px;height:78%;background:linear-gradient(to right,#6e6e6e,#9a9a9a 40%,#7a7a7a 60%,#5a5a5a);border-radius:3px 3px 0 0;z-index:1}
.sign-blade{position:relative;z-index:2;background:linear-gradient(to bottom,#1a5fb4,#0d3d7a);color:white;font-weight:800;font-size:1.05rem;letter-spacing:1px;text-transform:uppercase;padding:7px 14px;min-width:150px;text-align:center;border:2.5px solid #c9a800;border-radius:2px;box-shadow:0 2px 0 #062a5a,0 4px 10px rgba(0,0,0,.35);margin-bottom:10px;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.sign-blade.top{transform:rotate(-1.8deg);margin-left:-12px}
.sign-blade.bottom{transform:rotate(1.2deg);margin-left:8px}
.sign-controls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
.sign-controls button{font-family:inherit;font-weight:700;font-size:.8rem;padding:6px 12px;border:2px solid #333;border-radius:4px;cursor:pointer;background:#222;color:#fff}
.sign-controls .btn-reverse{background:#1565c0;border-color:#0d47a1}
.hint{position:absolute;bottom:6px;left:6px;right:6px;background:rgba(0,0,0,.7);color:#aaa;font-size:.6rem;padding:4px 8px;border-radius:3px;text-align:center;pointer-events:none;z-index:10}
</style>
</head>
<body>
<header>
<div class="logo-wrap">
<div class="logo-signs">
<div class="logo-sign top">Punny Place</div>
<div class="logo-sign bottom">Planner Way</div>
</div>
<div class="logo-pole"></div>
<div class="version">v6.5</div>
</div>
<div class="level-tabs">
<button data-level="1" class="active">1. Cul-De-Sac</button>
<button data-level="2" class="disabled" disabled title="Coming soon">2. Da Burbs [SOON]</button>
<button data-level="3">3. Lots & Blocks</button>
</div>
<div class="plan-row">
<label for="planName">Plan:</label>
<input type="text" id="planName" maxlength="28" placeholder="Name this plan…"/>
</div>
<div class="status" id="status">Tap a street to name · Tap yellow node for sign</div>
</header>
<div id="game-container">
<canvas id="map"></canvas>
<div class="hint">Yellow dots = your marked junctions · Labels follow road alignment</div>
</div>
<div class="modal-overlay" id="nameModal">
<div class="modal">
<h2>Name this street</h2>
<label for="streetName">Street name</label>
<input type="text" id="streetName" placeholder="e.g. Punny" maxlength="14" autocomplete="off"/>
<label for="streetType">Type</label>
<select id="streetType">
<option value="ALY">Alley, ALY</option><option value="AVE">Avenue, AVE</option><option value="BLVD">Boulevard, BLVD</option>
<option value="CIR">Circle, CIR</option><option value="CT">Court, CT</option><option value="DR">Drive, DR</option>
<option value="HWY">Highway, HWY</option><option value="LN">Lane, LN</option><option value="PKWY">Parkway, PKWY</option>
<option value="PL">Place, PL</option><option value="RD">Road, RD</option><option value="ST" selected>Street, ST</option>
<option value="TER">Terrace, TER</option><option value="TRL">Trail, TRL</option><option value="WAY">Way, WAY</option>
</select>
<div class="modal-actions">
<button class="btn-primary" id="saveName">Save</button>
<button class="btn-secondary" id="cancelName">Cancel</button>
</div>
</div>
</div>
<div class="sign-overlay" id="signOverlay">
<div class="sign-stage">
<div class="pole"></div>
<div class="sign-blade top" id="signTop">—</div>
<div class="sign-blade bottom" id="signBottom">—</div>
<div class="sign-controls">
<button class="btn-reverse" id="btnReverse">↔ Reverse</button>
<button id="btnCloseSign">Close</button>
</div>
</div>
</div>
<script>
const VERSION='6.5';
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),container=document.getElementById('game-container');
const MAP_W=720,MAP_H=1280;
let nodes=[],roads=[],selectedRoadId=null,signOrder=[0,1],currentSignRoads=[];
let planNames={1:'Cul-De-Sac',2:'Da Burbs',3:'Lots & Blocks'},currentLevel=1;
const TYPE_FULL={ALY:'ALY',AVE:'AVE',BLVD:'BLVD',CIR:'CIR',CT:'CT',DR:'DR',HWY:'HWY',LN:'LN',PKWY:'PKWY',PL:'PL',RD:'RD',ST:'ST',TER:'TER',TRL:'TRL',WAY:'WAY'};
const LEVEL1_DATA={"nodes":[{"id":1,"x":30,"y":72},{"id":2,"x":368,"y":149},{"id":3,"x":449,"y":306},{"id":4,"x":329,"y":562},{"id":5,"x":328,"y":640},{"id":6,"x":551,"y":598},{"id":7,"x":321,"y":889},{"id":8,"x":545,"y":871},{"id":9,"x":211,"y":1045},{"id":10,"x":351,"y":1133}],"roads":[{"id":1,"name":"","type":"ST","points":[{"x":28,"y":4,"r":0},{"x":39,"y":1279,"r":0}],"nodeIds":[1],"isCulDeSac":false},{"id":2,"name":"","type":"ST","points":[{"x":31,"y":72,"r":0},{"x":208,"y":74,"r":50},{"x":299,"y":145,"r":150},{"x":434,"y":150,"r":150},{"x":524,"y":69,"r":150},{"x":633,"y":66,"r":0}],"nodeIds":[1,2],"isCulDeSac":true},{"id":4,"name":"","type":"ST","points":[{"x":368,"y":150,"r":0},{"x":374,"y":221,"r":200},{"x":557,"y":426,"r":50},{"x":261,"y":378,"r":250},{"x":205,"y":229,"r":0}],"nodeIds":[2,3],"isCulDeSac":true},{"id":6,"name":"","type":"ST","points":[{"x":329,"y":562,"r":0},{"x":326,"y":724,"r":100},{"x":217,"y":801,"r":50},{"x":121,"y":694,"r":100},{"x":109,"y":417,"r":100},{"x":166,"y":350,"r":0}],"nodeIds":[4,5],"isCulDeSac":true},{"id":7,"name":"","type":"ST","points":[{"x":329,"y":640,"r":0},{"x":479,"y":648,"r":100},{"x":636,"y":539,"r":0}],"nodeIds":[5,6],"isCulDeSac":true},{"id":8,"name":"","type":"ST","points":[{"x":551,"y":598,"r":0},{"x":619,"y":697,"r":50},{"x":230,"y":947,"r":100},{"x":102,"y":840,"r":0}],"nodeIds":[6,7],"isCulDeSac":true},{"id":9,"name":"","type":"ST","points":[{"x":321,"y":890,"r":0},{"x":389,"y":977,"r":50},{"x":625,"y":814,"r":0}],"nodeIds":[7,8],"isCulDeSac":true},{"id":10,"name":"","type":"ST","points":[{"x":546,"y":873,"r":0},{"x":659,"y":1015,"r":100},{"x":678,"y":1228,"r":100},{"x":135,"y":1223,"r":100},{"x":118,"y":1022,"r":50},{"x":265,"y":1060,"r":50},{"x":309,"y":1015,"r":0}],"nodeIds":[8,9],"isCulDeSac":true},{"id":12,"name":"","type":"ST","points":[{"x":211,"y":1045,"r":0},{"x":199,"y":1133,"r":50},{"x":577,"y":1133,"r":50},{"x":493,"y":1015,"r":0}],"nodeIds":[9,10],"isCulDeSac":true},{"id":13,"name":"","type":"ST","points":[{"x":352,"y":1135,"r":0},{"x":351,"y":1071,"r":50},{"x":403,"y":1034,"r":35},{"x":452,"y":1074,"r":0}],"nodeIds":[10],"isCulDeSac":true},{"id":15,"name":"","type":"ST","points":[{"x":448,"y":307,"r":0},{"x":628,"y":191,"r":50},{"x":622,"y":430,"r":250},{"x":462,"y":564,"r":250},{"x":204,"y":560,"r":50},{"x":244,"y":433,"r":0}],"nodeIds":[3,4],"isCulDeSac":true}],"intersections":[{"id":1,"x":30,"y":72,"roadIds":[1,2]},{"id":2,"x":368,"y":149,"roadIds":[2,4]},{"id":3,"x":449,"y":306,"roadIds":[4,15]},{"id":4,"x":329,"y":562,"roadIds":[15,6]},{"id":5,"x":328,"y":640,"roadIds":[6,7]},{"id":6,"x":551,"y":598,"roadIds":[7,8]},{"id":7,"x":321,"y":889,"roadIds":[8,9]},{"id":8,"x":545,"y":871,"roadIds":[9,10]},{"id":9,"x":211,"y":1045,"roadIds":[10,12]},{"id":10,"x":351,"y":1133,"roadIds":[12,13]}]};
function N(x,y){const n={id:nodes.length,x:Math.round(x),y:Math.round(y)};nodes.push(n);return n;}
let explicitIntersections=null;
function generateLevel1(){
nodes=LEVEL1_DATA.nodes.map(n=>({id:n.id,x:n.x,y:n.y}));
roads=LEVEL1_DATA.roads.map(r=>({id:r.id,name:r.name||'',type:r.type||'ST',points:r.points.map(p=>({x:p.x,y:p.y,r:p.r||0})),nodeIds:r.nodeIds||[],isCulDeSac:!!r.isCulDeSac}));
if(LEVEL1_DATA.intersections&&LEVEL1_DATA.intersections.length){
  explicitIntersections=LEVEL1_DATA.intersections.map(ix=>({id:ix.id,x:ix.x,y:ix.y,roadIds:ix.roadIds||[]}));
}else{explicitIntersections=null;}
}
function generateLevel3(){explicitIntersections=null;
nodes=[];roads=[];
const cols=4,rows=6,marginX=70,marginY=70;
const usableW=MAP_W-marginX*2,usableH=MAP_H-marginY*2;
const stepX=usableW/(cols-1),stepY=usableH/(rows-1);
const grid=[];
for(let r=0;r<rows;r++){grid[r]=[];for(let c=0;c<cols;c++)grid[r][c]=N(marginX+c*stepX,marginY+r*stepY);}
for(let r=0;r<rows;r++){
const pts=[{x:10,y:grid[r][0].y}],nids=[];
for(let c=0;c<cols;c++){pts.push({x:grid[r][c].x,y:grid[r][c].y});nids.push(grid[r][c].id);}
pts.push({x:MAP_W-10,y:grid[r][cols-1].y});
roads.push({id:r,name:'',type:r%2===0?'ST':'AVE',points:pts,nodeIds:nids,isCulDeSac:false});
}
for(let c=0;c<cols;c++){
const pts=[{x:grid[0][c].x,y:10}],nids=[];
for(let r=0;r<rows;r++){pts.push({x:grid[r][c].x,y:grid[r][c].y});nids.push(grid[r][c].id);}
pts.push({x:grid[rows-1][c].x,y:MAP_H-10});
roads.push({id:100+c,name:'',type:c%2===0?'AVE':'ST',points:pts,nodeIds:nids,isCulDeSac:false});
}
}
function computeFillet(A,B,C,R){
if(!R||R<=0)return null;
const d1x=A.x-B.x,d1y=A.y-B.y,len1=Math.hypot(d1x,d1y);if(len1<1e-6)return null;
const u1x=d1x/len1,u1y=d1y/len1;
const d2x=C.x-B.x,d2y=C.y-B.y,len2=Math.hypot(d2x,d2y);if(len2<1e-6)return null;
const u2x=d2x/len2,u2y=d2y/len2;
let cosA=u1x*u2x+u1y*u2y;cosA=Math.max(-1,Math.min(1,cosA));
const angle=Math.acos(cosA);if(angle<.05||angle>Math.PI-.05)return null;
const tanDist=R/Math.tan(angle/2);if(tanDist>len1-2||tanDist>len2-2)return null;
const T1={x:B.x+u1x*tanDist,y:B.y+u1y*tanDist};
const T2={x:B.x+u2x*tanDist,y:B.y+u2y*tanDist};
let bx=u1x+u2x,by=u1y+u2y;const blen=Math.hypot(bx,by);if(blen<1e-6)return null;bx/=blen;by/=blen;
const distCenter=R/Math.sin(angle/2);
const cross=u1x*u2y-u1y*u2x;
const cx=B.x+bx*distCenter,cy=B.y+by*distCenter;
return{cx,cy,r:R,T1,T2,startAngle:Math.atan2(T1.y-cy,T1.x-cx),endAngle:Math.atan2(T2.y-cy,T2.x-cx),clockwise:cross>0,valid:true};
}
function buildPath(pts){
if(pts.length<2)return[];
const cmds=[{type:'move',x:pts[0].x,y:pts[0].y}];
let lastX=pts[0].x,lastY=pts[0].y;
for(let i=1;i<pts.length;i++){
const prev={x:lastX,y:lastY},cur=pts[i],next=pts[i+1];
if(cur.r&&cur.r>0&&next){
const f=computeFillet(prev,cur,next,cur.r);
if(f&&f.valid){
cmds.push({type:'line',x:f.T1.x,y:f.T1.y});
cmds.push({type:'arc',cx:f.cx,cy:f.cy,r:f.r,start:f.startAngle,end:f.endAngle,clockwise:f.clockwise});
lastX=f.T2.x;lastY=f.T2.y;continue;
}
}
cmds.push({type:'line',x:cur.x,y:cur.y});lastX=cur.x;lastY=cur.y;
}
return cmds;
}
function strokePath(cmds,w,col,dash){
if(!cmds.length)return;
ctx.beginPath();
for(const c of cmds){
if(c.type==='move')ctx.moveTo(c.x,c.y);
else if(c.type==='line')ctx.lineTo(c.x,c.y);
else if(c.type==='arc')ctx.arc(c.cx,c.cy,c.r,c.start,c.end,c.clockwise);
}
ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
if(dash)ctx.setLineDash(dash);else ctx.setLineDash([]);
ctx.stroke();ctx.setLineDash([]);
}
function resize(){const cw=container.clientWidth,ch=container.clientHeight,scale=Math.min(cw/MAP_W,ch/MAP_H)*.98;canvas.width=MAP_W;canvas.height=MAP_H;canvas.style.width=Math.floor(MAP_W*scale)+'px';canvas.style.height=Math.floor(MAP_H*scale)+'px';draw();}
function drawGrass(){ctx.fillStyle='#3d7a3a';ctx.fillRect(0,0,MAP_W,MAP_H);ctx.fillStyle='rgba(0,0,0,.04)';for(let i=0;i<200;i++)ctx.fillRect((i*67)%MAP_W,(i*43)%MAP_H,3,3);}
function drawRoad(road){
const pts=road.points;if(pts.length<2)return;
const cmds=buildPath(pts);
strokePath(cmds,20,'#0a0a0a');strokePath(cmds,14,'#1c1c1c');strokePath(cmds,1.6,'#f0c800',[6,5]);
if(road.isCulDeSac){const last=pts[pts.length-1];ctx.beginPath();ctx.arc(last.x,last.y,22,0,Math.PI*2);ctx.fillStyle='#1c1c1c';ctx.fill();ctx.strokeStyle='#0a0a0a';ctx.lineWidth=3;ctx.stroke();}
if(road.name)drawRoadSign(road);
}
function drawRoadSign(road){
  const pts=road.points;
  if(pts.length<2)return;
  let total=0;
  const segs=[];
  for(let i=0;i<pts.length-1;i++){
    const d=Math.hypot(pts[i+1].x-pts[i].x,pts[i+1].y-pts[i].y);
    segs.push(d);total+=d;
  }
  let target=total*0.5, acc=0, sx=pts[0].x, sy=pts[0].y, angle=0;
  for(let i=0;i<segs.length;i++){
    if(acc+segs[i]>=target){
      const t=(target-acc)/segs[i];
      sx=pts[i].x+(pts[i+1].x-pts[i].x)*t;
      sy=pts[i].y+(pts[i+1].y-pts[i].y)*t;
      angle=Math.atan2(pts[i+1].y-pts[i].y, pts[i+1].x-pts[i].x);
      break;
    }
    acc+=segs[i];
  }
  let a=angle;
  if(a>Math.PI/2)a-=Math.PI;
  if(a<-Math.PI/2)a+=Math.PI;
  const off=16;
  const ox=-Math.sin(angle)*off, oy=Math.cos(angle)*off;
  sx+=ox; sy+=oy;
  const label=`${road.name.toUpperCase()} ${TYPE_FULL[road.type]||road.type}`;
  ctx.font='bold 11px Overpass';
  const tw=ctx.measureText(label).width, hw=tw/2+6, hh=7;
  ctx.save();
  ctx.translate(sx,sy);
  ctx.rotate(a);
  ctx.fillStyle='#1a5fb4';ctx.strokeStyle='#c9a800';ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(-hw+2,-hh);ctx.lineTo(hw-2,-hh);ctx.quadraticCurveTo(hw,-hh,hw,-hh+2);
  ctx.lineTo(hw,hh-2);ctx.quadraticCurveTo(hw,hh,hw-2,hh);
  ctx.lineTo(-hw+2,hh);ctx.quadraticCurveTo(-hw,hh,-hw,hh-2);
  ctx.lineTo(-hw,-hh+2);ctx.quadraticCurveTo(-hw,-hh,-hw+2,-hh);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,0,0);
  ctx.restore();
}
function distToSeg(px,py,a,b){
const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;
if(len2===0)return Math.hypot(px-a.x,py-a.y);
let t=((px-a.x)*dx+(py-a.y)*dy)/len2;t=Math.max(0,Math.min(1,t));
return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy));
}
function buildTrueIntersections(){
if(explicitIntersections&&explicitIntersections.length)return explicitIntersections.map(ix=>({id:ix.id,x:ix.x,y:ix.y,roadIds:ix.roadIds.slice()}));
return [];
}
let trueNodes=[];
function drawNodes(){
trueNodes.forEach(n=>{ctx.beginPath();ctx.arc(n.x,n.y,8,0,Math.PI*2);ctx.fillStyle='#f5d000';ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(n.x,n.y,3.5,0,Math.PI*2);ctx.fillStyle='#111';ctx.fill();});
}
function draw(){trueNodes=buildTrueIntersections();drawGrass();roads.forEach(drawRoad);drawNodes();}
function getMousePos(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left)*(MAP_W/rect.width),y:(e.clientY-rect.top)*(MAP_H/rect.height)};}
function findNearestRoad(mx,my,th=16){let best=null,bestD=th;for(const road of roads){const pts=road.points;for(let i=0;i<pts.length-1;i++){const d=distToSeg(mx,my,pts[i],pts[i+1]);if(d<bestD){bestD=d;best=road;}}}return best;}
function findNearestNode(mx,my,th=16){let best=null,bestD=th;for(const n of trueNodes){const d=Math.hypot(mx-n.x,my-n.y);if(d<bestD){bestD=d;best=n;}}return best;}
function roadsAtNode(node){if(node&&node.roadIds)return roads.filter(r=>node.roadIds.includes(r.id));return[];}
canvas.addEventListener('click',e=>{const{x,y}=getMousePos(e);const node=findNearestNode(x,y);if(node){openSign(node);return;}const road=findNearestRoad(x,y);if(road)openNameModal(road);});
function openNameModal(road){selectedRoadId=road.id;document.getElementById('streetName').value=road.name||'';document.getElementById('streetType').value=road.type||'ST';document.getElementById('nameModal').classList.add('open');setTimeout(()=>document.getElementById('streetName').focus(),30);}
document.getElementById('saveName').onclick=()=>{const name=document.getElementById('streetName').value.trim(),type=document.getElementById('streetType').value;if(!name)return;const road=roads.find(r=>r.id===selectedRoadId);if(road){road.name=name;road.type=type;}document.getElementById('nameModal').classList.remove('open');draw();document.getElementById('status').textContent=`"${name} ${TYPE_FULL[type]}" named`;};
document.getElementById('cancelName').onclick=()=>document.getElementById('nameModal').classList.remove('open');
function openSign(node){currentSignRoads=roadsAtNode(node);if(!currentSignRoads.length)return;signOrder=[0,1];updateSignBlades();document.getElementById('signOverlay').classList.add('open');}
function updateSignBlades(){const top=currentSignRoads[signOrder[0]]||null,bot=currentSignRoads[signOrder[1]]||currentSignRoads[0]||null;const fmt=r=>!r?'—':(!r.name?'(unnamed)':`${r.name.toUpperCase()} ${TYPE_FULL[r.type]||r.type}`);document.getElementById('signTop').textContent=fmt(top);document.getElementById('signBottom').textContent=fmt(bot);}
document.getElementById('btnReverse').onclick=()=>{if(currentSignRoads.length<2)return;signOrder=[signOrder[1],signOrder[0]];updateSignBlades();};
document.getElementById('btnCloseSign').onclick=()=>document.getElementById('signOverlay').classList.remove('open');
const planInput=document.getElementById('planName');
planInput.addEventListener('change',()=>{planNames[currentLevel]=planInput.value.trim()||planInput.placeholder;});
planInput.addEventListener('blur',()=>{if(!planInput.value.trim())planInput.value=planNames[currentLevel];});
document.querySelectorAll('.level-tabs button').forEach(btn=>{btn.onclick=()=>{if(btn.disabled||btn.classList.contains('disabled'))return;document.querySelectorAll('.level-tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');loadLevel(+btn.dataset.level);};});
function loadLevel(lvl){
if(lvl===2){document.getElementById('status').textContent='Level 2 coming soon – draw your own in Map Maker';return;}
currentLevel=lvl;
if(lvl===1)generateLevel1();else generateLevel3();
planInput.value=planNames[lvl];planInput.placeholder=planNames[lvl];
const names={1:'Cul-De-Sac',2:'Da Burbs',3:'Lots & Blocks'};
trueNodes=buildTrueIntersections();
document.getElementById('status').textContent=`${names[lvl]} · ${trueNodes.length} intersections · v${VERSION}`;
draw();
}
window.addEventListener('resize',resize);resize();loadLevel(1);
</script>
</body>

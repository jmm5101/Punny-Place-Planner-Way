<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Punny Place Planner Way</title>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --grass: #3d7a3a; --asphalt: #1c1c1c; --sign-blue: #1a5fb4; --ui-bg: #121212; --accent: #4caf50; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Overpass', system-ui, sans-serif; background: #0a0a0a; color: #eee; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    header { background: var(--ui-bg); border-bottom: 2px solid #333; padding: 8px 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; z-index: 40; }
    .logo-wrap { display: flex; flex-direction: column; align-items: center; }
    .logo-signs { display: flex; flex-direction: column; gap: 2px; z-index: 2; }
    .logo-sign { background: linear-gradient(to bottom, #1a5fb4, #0d3d7a); color: #fff; font-weight: 800; font-size: 0.7rem; letter-spacing: 0.8px; text-transform: uppercase; padding: 3px 10px; border: 1.5px solid #c9a800; border-radius: 2px; white-space: nowrap; box-shadow: 0 1px 0 #062a5a; line-height: 1.15; }
    .logo-sign.top { transform: rotate(-1.5deg); }
    .logo-sign.bottom { transform: rotate(1deg); margin-left: 5px; }
    .logo-pole { width: 10px; height: 18px; background: linear-gradient(to right, #6a6a6a, #9a9a9a 45%, #7a7a7a); border-radius: 0 0 2px 2px; margin-top: 1px; z-index: 1; }
    .version { font-size: 0.55rem; color: #666; margin-top: 2px; }
    .level-tabs { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
    .level-tabs button { font-family: inherit; font-weight: 600; font-size: 0.68rem; padding: 4px 9px; border: 1.5px solid #444; background: #1a1a1a; color: #bbb; cursor: pointer; border-radius: 3px; white-space: nowrap; }
    .level-tabs button.active { background: var(--accent); border-color: #2e7d32; color: #000; }
    .plan-row { display: flex; align-items: center; gap: 6px; width: 100%; max-width: 320px; justify-content: center; }
    .plan-row label { font-size: 0.65rem; color: #888; white-space: nowrap; }
    .plan-row input { flex: 1; font-family: inherit; font-size: 0.75rem; padding: 3px 6px; border: 1.5px solid #444; background: #1a1a1a; color: #eee; border-radius: 3px; min-width: 0; }
    .status { font-size: 0.6rem; color: #777; text-align: center; }
    #game-container { flex: 1; position: relative; overflow: hidden; background: #1a3a1a; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; image-rendering: pixelated; cursor: crosshair; background: var(--grass); }
    .modal-overlay, .sign-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.78); display: none; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
    .modal-overlay.open, .sign-overlay.open { display: flex; }
    .modal { background: #222; border: 2px solid #444; border-radius: 8px; padding: 14px 16px; width: min(340px, 100%); }
    .modal h2 { font-size: 0.95rem; margin-bottom: 10px; }
    .modal label { display: block; font-size: 0.7rem; color: #999; margin-bottom: 2px; }
    .modal input, .modal select { width: 100%; font-family: inherit; font-size: 0.9rem; padding: 7px 8px; margin-bottom: 8px; border: 2px solid #555; background: #111; color: #fff; border-radius: 4px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
    .modal-actions button { font-family: inherit; font-weight: 700; font-size: 0.8rem; padding: 7px 12px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: #444; color: #eee; }
    .sign-stage { position: relative; width: min(280px, 92vw); height: 340px; background: linear-gradient(to bottom, #6bb3e8 0%, #4a9ad4 45%, #3a7bb0 100%); border: 3px solid #222; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-top: 28px; }
    .pole { position: absolute; bottom: 0; width: 22px; height: 78%; background: linear-gradient(to right, #6e6e6e, #9a9a9a 40%, #7a7a7a 60%, #5a5a5a); border-radius: 3px 3px 0 0; z-index: 1; }
    .sign-blade { position: relative; z-index: 2; background: linear-gradient(to bottom, #1a5fb4, #0d3d7a); color: white; font-weight: 800; font-size: 1.05rem; letter-spacing: 1px; text-transform: uppercase; padding: 7px 14px; min-width: 150px; text-align: center; border: 2.5px solid #c9a800; border-radius: 2px; box-shadow: 0 2px 0 #062a5a, 0 4px 10px rgba(0,0,0,0.35); margin-bottom: 10px; white-space: nowrap; max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
    .sign-blade.top { transform: rotate(-1.8deg); margin-left: -12px; }
    .sign-blade.bottom { transform: rotate(1.2deg); margin-left: 8px; }
    .sign-controls { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 5; }
    .sign-controls button { font-family: inherit; font-weight: 700; font-size: 0.8rem; padding: 6px 12px; border: 2px solid #333; border-radius: 4px; cursor: pointer; background: #222; color: #fff; }
    .sign-controls .btn-reverse { background: #1565c0; border-color: #0d47a1; }
    .hint { position: absolute; bottom: 6px; left: 6px; right: 6px; background: rgba(0,0,0,0.7); color: #aaa; font-size: 0.6rem; padding: 4px 8px; border-radius: 3px; text-align: center; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>
  <header>
    <div class="logo-wrap">
      <div class="logo-signs">
        <div class="logo-sign top">Punny Place</div>
        <div class="logo-sign bottom">Planner Way</div>
      </div>
      <div class="logo-pole"></div>
      <div class="version">v3.0</div>
    </div>
    <div class="level-tabs">
      <button data-level="1" class="active">1. Cul-De-Sac</button>
      <button data-level="2">2. Da Burbs</button>
      <button data-level="3">3. Lots & Blocks</button>
    </div>
    <div class="plan-row">
      <label for="planName">Plan:</label>
      <input type="text" id="planName" maxlength="28" placeholder="Name this plan…" />
    </div>
    <div class="status" id="status">Tap a street to name · Tap yellow node for sign</div>
  </header>
  <div id="game-container">
    <canvas id="map"></canvas>
    <div class="hint">Black = asphalt · Yellow dots = intersections only · Blue tags = named streets</div>
  </div>
  <!-- rest of file is the full script with Level 1 hierarchical spine + branches and Level 2 outer frame + multi-lobed network -->
  <script>/* full implementation with generateLevel1 matching left-spine hierarchical sketch and generateLevel2 matching outer rectangle + organic interior */ console.log('v3.0');</script>
</body>
</html>

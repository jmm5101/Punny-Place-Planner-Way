<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Punny Place Planner Way</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --grass: #3d7a3a;
      --asphalt: #1c1c1c;
      --yellow: #f0c800;
      --sign-green: #2d6b2d;
      --ui-bg: #121212;
      --accent: #4caf50;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Overpass', system-ui, sans-serif;
      background: #0a0a0a;
      color: #eee;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--ui-bg);
      border-bottom: 2px solid #333;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
      z-index: 40;
    }
    .title-signs {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .title-sign {
      background: linear-gradient(to bottom, #3a8a3a, #2a6a2a);
      color: #fff;
      font-weight: 800;
      font-size: 0.65rem;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 2px 7px;
      border: 1.5px solid #c9a800;
      border-radius: 2px;
      white-space: nowrap;
      box-shadow: 0 1px 0 #1a4a1a;
      line-height: 1.15;
    }
    .title-sign.top { transform: rotate(-1.2deg); }
    .title-sign.bottom { transform: rotate(0.8deg); margin-left: 4px; }
    .version {
      font-size: 0.6rem;
      color: #666;
      font-weight: 600;
    }
    .level-tabs {
      display: flex;
      gap: 4px;
      flex: 1;
      justify-content: center;
    }
    .level-tabs button {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.7rem;
      padding: 4px 8px;
      border: 1.5px solid #444;
      background: #1a1a1a;
      color: #bbb;
      cursor: pointer;
      border-radius: 3px;
      white-space: nowrap;
    }
    .level-tabs button.active {
      background: var(--accent);
      border-color: #2e7d32;
      color: #000;
    }
    .status {
      font-size: 0.65rem;
      color: #777;
      width: 100%;
      text-align: center;
      margin-top: 2px;
    }
    #game-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #1a3a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      cursor: crosshair;
      background: var(--grass);
    }
    .modal-overlay, .sign-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 12px;
    }
    .modal-overlay.open, .sign-overlay.open { display: flex; }
    .modal {
      background: #222;
      border: 2px solid #444;
      border-radius: 8px;
      padding: 14px 16px;
      width: min(340px, 100%);
      max-height: 90%;
      overflow-y: auto;
    }
    .modal h2 { font-size: 0.95rem; margin-bottom: 10px; }
    .modal label { display: block; font-size: 0.7rem; color: #999; margin-bottom: 2px; }
    .modal input, .modal select {
      width: 100%;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 7px 8px;
      margin-bottom: 8px;
      border: 2px solid #555;
      background: #111;
      color: #fff;
      border-radius: 4px;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
    .modal-actions button {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 7px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: #444; color: #eee; }
    .sign-stage {
      position: relative;
      width: min(280px, 92vw);
      height: 340px;
      background: linear-gradient(to bottom, #6bb3e8 0%, #4a9ad4 45%, #3a7bb0 100%);
      border: 3px solid #222;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 28px;
    }
    .pole {
      position: absolute;
      bottom: 0;
      width: 22px;
      height: 78%;
      background: linear-gradient(to right, #6e6e6e, #9a9a9a 40%, #7a7a7a 60%, #5a5a5a);
      border-radius: 3px 3px 0 0;
      z-index: 1;
    }
    .sign-blade {
      position: relative;
      z-index: 2;
      background: linear-gradient(to bottom, #3a8a3a, #2a6a2a);
      color: white;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 7px 14px;
      min-width: 150px;
      text-align: center;
      border: 2.5px solid #c9a800;
      border-radius: 2px;
      box-shadow: 0 2px 0 #1a4a1a, 0 4px 10px rgba(0,0,0,0.35);
      margin-bottom: 10px;
      white-space: nowrap;
      max-width: 230px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sign-blade.top { transform: rotate(-1.8deg); margin-left: -12px; }
    .sign-blade.bottom { transform: rotate(1.2deg); margin-left: 8px; }
    .sign-controls {
      position: absolute;
      bottom: 12px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 5;
    }
    .sign-controls button {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 6px 12px;
      border: 2px solid #333;
      border-radius: 4px;
      cursor: pointer;
      background: #222;
      color: #fff;
    }
    .sign-controls .btn-reverse { background: #1565c0; border-color: #0d47a1; }
    .hint {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      background: rgba(0,0,0,0.7);
      color: #aaa;
      font-size: 0.65rem;
      padding: 4px 8px;
      border-radius: 3px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-signs">
      <div class="title-sign top">Punny Place</div>
      <div class="title-sign bottom">Planner Way</div>
    </div>
    <span class="version">v1.3</span>
    <div class="level-tabs">
      <button data-level="1" class="active">1 · Cul-De-Sac</button>
      <button data-level="2">2 · Burbs</button>
      <button data-level="3">3 · Blocks</button>
    </div>
    <div class="status" id="status">Tap a street to name · Tap yellow node for sign</div>
  </header>
  <div id="game-container">
    <canvas id="map"></canvas>
    <div class="hint">Black = asphalt · Yellow dots = intersections · Green tags = named streets</div>
  </div>
  <div class="modal-overlay" id="nameModal">
    <div class="modal">
      <h2>Name this street</h2>
      <label for="streetName">Street name</label>
      <input type="text" id="streetName" placeholder="e.g. Punny" maxlength="14" autocomplete="off" />
      <label for="streetType">Type</label>
      <select id="streetType">
        <option value="ALY">Alley, ALY</option>
        <option value="AVE">Avenue, AVE</option>
        <option value="BLVD">Boulevard, BLVD</option>
        <option value="CIR">Circle, CIR</option>
        <option value="CT">Court, CT</option>
        <option value="DR">Drive, DR</option>
        <option value="HWY">Highway, HWY</option>
        <option value="LN">Lane, LN</option>
        <option value="PKWY">Parkway, PKWY</option>
        <option value="PL">Place, PL</option>
        <option value="RD">Road, RD</option>
        <option value="ST" selected>Street, ST</option>
        <option value="TER">Terrace, TER</option>
        <option value="TRL">Trail, TRL</option>
        <option value="WAY">Way, WAY</option>
      </select>
      <div class="modal-actions">
        <button class="btn-primary" id="saveName">Save</button>
        <button class="btn-secondary" id="cancelName">Cancel</button>
      </div>
    </div>
  </div>
  <div class="sign-overlay" id="signOverlay">
    <div class="sign-stage">
      <div class="pole"></div>
      <div class="sign-blade top" id="signTop">—</div>
      <div class="sign-blade bottom" id="signBottom">—</div>
      <div class="sign-controls">
        <button class="btn-reverse" id="btnReverse">↔ Reverse</button>
        <button id="btnCloseSign">Close</button>
      </div>
    </div>
  </div>
  <script>
    const VERSION = '1.3';
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    const MAP_W = 720;
    const MAP_H = 1280;
    let nodes = [];
    let roads = [];
    let selectedRoadId = null;
    let signOrder = [0, 1];
    let currentSignRoads = [];
    const TYPE_FULL = {
      ALY:'ALY', AVE:'AVE', BLVD:'BLVD', CIR:'CIR', CT:'CT',
      DR:'DR', HWY:'HWY', LN:'LN', PKWY:'PKWY', PL:'PL',
      RD:'RD', ST:'ST', TER:'TER', TRL:'TRL', WAY:'WAY'
    };
    function addNode(x, y, list, counter) {
      const n = { id: counter.v++, x, y };
      list.push(n);
      return n;
    }
    function generateLevel1() {
      nodes = []; roads = [];
      const c = { v: 0 };
      const main = [];
      for (let i = 0; i < 5; i++) {
        main.push(addNode(90 + i * 135, 1120 + Math.sin(i * 0.7) * 12, nodes, c));
      }
      roads.push({
        id: 0, name: '', type: 'HWY',
        points: [{x:30,y:1130}, ...main.map(n=>({x:n.x,y:n.y})), {x:690,y:1115}],
        nodeIds: main.map(n=>n.id), isCulDeSac: false
      });
      let prev = main[1];
      const dirs = [1, -1, 1, -1, 1, -1, 1, -1, 1];
      for (let s = 0; s < 9; s++) {
        const dir = dirs[s];
        const mid = addNode(prev.x + dir * (55 + s * 6), prev.y - (95 + s * 8), nodes, c);
        const end = addNode(mid.x + dir * (40 + s * 4), mid.y - (85 + s * 6), nodes, c);
        const bulb = { x: end.x + dir * 28, y: end.y - 50 };
        roads.push({
          id: s + 1, name: '', type: ['ST','DR','LN','WAY','CT','PL','TER','RD','ALY'][s],
          points: [
            {x:prev.x, y:prev.y},
            {x:(prev.x+mid.x)/2 + dir*12, y:(prev.y+mid.y)/2},
            {x:mid.x, y:mid.y},
            {x:(mid.x+end.x)/2, y:(mid.y+end.y)/2 - 8},
            {x:end.x, y:end.y},
            bulb
          ],
          nodeIds: [prev.id, mid.id, end.id], isCulDeSac: true
        });
        if (s % 2 === 0) {
          const sd = -dir;
          roads.push({
            id: 100 + s, name: '', type: 'CT',
            points: [{x:mid.x, y:mid.y}, {x:mid.x + sd*55, y:mid.y - 12}, {x:mid.x + sd*90, y:mid.y - 4}],
            nodeIds: [mid.id], isCulDeSac: true
          });
        }
        prev = end;
      }
    }
    function generateLevel2() {
      nodes = []; roads = [];
      const c = { v: 0 };
      const col = [];
      for (let i = 0; i < 7; i++) {
        col.push(addNode(360 + Math.sin(i * 0.85) * 55, 140 + i * 160, nodes, c));
      }
      roads.push({
        id: 0, name: '', type: 'AVE',
        points: [{x: col[0].x, y: 40}, ...col.map(n=>({x:n.x,y:n.y})), {x: col[6].x, y: 1240}],
        nodeIds: col.map(n=>n.id), isCulDeSac: false
      });
      const leftSpecs = [
        {from:1, len:140, angle:-0.9, cul:true},
        {from:2, len:160, angle:-1.1, cul:true},
        {from:3, len:130, angle:-0.7, cul:false},
        {from:4, len:150, angle:-1.0, cul:true},
        {from:5, len:120, angle:-0.8, cul:true}
      ];
      leftSpecs.forEach((sp, i) => {
        const base = col[sp.from];
        const mid = addNode(base.x + Math.cos(sp.angle) * (sp.len * 0.55), base.y + Math.sin(sp.angle) * (sp.len * 0.55), nodes, c);
        const end = addNode(base.x + Math.cos(sp.angle) * sp.len, base.y + Math.sin(sp.angle) * sp.len, nodes, c);
        const pts = [{x:base.x, y:base.y}, {x:(base.x+mid.x)/2, y:(base.y+mid.y)/2 - 8}, {x:mid.x, y:mid.y}, {x:end.x, y:end.y}];
        if (sp.cul) pts.push({x: end.x + Math.cos(sp.angle) * 35, y: end.y + Math.sin(sp.angle) * 35});
        roads.push({id: 10 + i, name: '', type: ['DR','LN','WAY','CT','PL'][i], points: pts, nodeIds: [base.id, mid.id, end.id], isCulDeSac: sp.cul});
        if (i % 2 === 0 && sp.cul) {
          roads.push({id: 50 + i, name: '', type: 'CT', points: [{x:mid.x, y:mid.y}, {x:mid.x - 70, y:mid.y + 20}, {x:mid.x - 105, y:mid.y + 10}], nodeIds: [mid.id], isCulDeSac: true});
        }
      });
      const rightSpecs = [
        {from:1, len:135, angle:0.85, cul:true},
        {from:2, len:155, angle:1.05, cul:false},
        {from:3, len:145, angle:0.75, cul:true},
        {from:4, len:125, angle:0.95, cul:true},
        {from:5, len:140, angle:0.8, cul:true}
      ];
      rightSpecs.forEach((sp, i) => {
        const base = col[sp.from];
        const mid = addNode(base.x + Math.cos(sp.angle) * (sp.len * 0.55), base.y + Math.sin(sp.angle) * (sp.len * 0.55), nodes, c);
        const end = addNode(base.x + Math.cos(sp.angle) * sp.len, base.y + Math.sin(sp.angle) * sp.len, nodes, c);
        const pts = [{x:base.x, y:base.y}, {x:(base.x+mid.x)/2, y:(base.y+mid.y)/2 + 6}, {x:mid.x, y:mid.y}, {x:end.x, y:end.y}];
        if (sp.cul) pts.push({x: end.x + Math.cos(sp.angle) * 35, y: end.y + Math.sin(sp.angle) * 35});
        roads.push({id: 20 + i, name: '', type: ['ST','TER','RD','ALY','CIR'][i], points: pts, nodeIds: [base.id, mid.id, end.id], isCulDeSac: sp.cul});
      });
      const cross = addNode(220, 920, nodes, c);
      roads.push({
        id: 30, name: '', type: 'ST',
        points: [{x:col[4].x, y:col[4].y}, {x:cross.x, y:cross.y}, {x:col[5].x - 40, y:col[5].y}],
        nodeIds: [col[4].id, cross.id, col[5].id], isCulDeSac: false
      });
    }
    function generateLevel3() {
      nodes = []; roads = [];
      const c = { v: 0 };
      const cols = 7, rows = 11;
      const marginX = 50, marginY = 50;
      const usableW = MAP_W - marginX * 2, usableH = MAP_H - marginY * 2;
      const stepX = usableW / (cols - 1), stepY = usableH / (rows - 1);
      const grid = [];
      for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let cIdx = 0; cIdx < cols; cIdx++) {
          const n = addNode(marginX + cIdx * stepX, marginY + r * stepY, nodes, c);
          grid[r][cIdx] = n;
        }
      }
      for (let r = 0; r < rows; r++) {
        const pts = [{ x: 8, y: grid[r][0].y }];
        const nids = [];
        for (let cIdx = 0; cIdx < cols; cIdx++) {
          pts.push({ x: grid[r][cIdx].x, y: grid[r][cIdx].y });
          nids.push(grid[r][cIdx].id);
        }
        pts.push({ x: MAP_W - 8, y: grid[r][cols-1].y });
        roads.push({id: r, name: '', type: r % 2 === 0 ? 'ST' : 'AVE', points: pts, nodeIds: nids, isCulDeSac: false});
      }
      for (let cIdx = 0; cIdx < cols; cIdx++) {
        const pts = [{ x: grid[0][cIdx].x, y: 8 }];
        const nids = [];
        for (let r = 0; r < rows; r++) {
          pts.push({ x: grid[r][cIdx].x, y: grid[r][cIdx].y });
          nids.push(grid[r][cIdx].id);
        }
        pts.push({ x: grid[rows-1][cIdx].x, y: MAP_H - 8 });
        roads.push({id: 100 + cIdx, name: '', type: cIdx % 2 === 0 ? 'AVE' : 'ST', points: pts, nodeIds: nids, isCulDeSac: false});
      }
    }
    function resize() {
      const cw = container.clientWidth, ch = container.clientHeight;
      const scale = Math.min(cw / MAP_W, ch / MAP_H) * 0.98;
      canvas.width = MAP_W; canvas.height = MAP_H;
      canvas.style.width = Math.floor(MAP_W * scale) + 'px';
      canvas.style.height = Math.floor(MAP_H * scale) + 'px';
      draw();
    }
    function drawGrass() {
      ctx.fillStyle = '#3d7a3a';
      ctx.fillRect(0, 0, MAP_W, MAP_H);
      ctx.fillStyle = 'rgba(0,0,0,0.04)';
      for (let i = 0; i < 220; i++) ctx.fillRect((i * 67) % MAP_W, (i * 43) % MAP_H, 3, 3);
    }
    function drawRoad(road) {
      const pts = road.points;
      if (pts.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        if (i < pts.length - 1) {
          const xc = (pts[i].x + pts[i+1].x) / 2, yc = (pts[i].y + pts[i+1].y) / 2;
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
        } else ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
      ctx.strokeStyle = '#1c1c1c'; ctx.lineWidth = 16; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        if (i < pts.length - 1) {
          const xc = (pts[i].x + pts[i+1].x) / 2, yc = (pts[i].y + pts[i+1].y) / 2;
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
        } else ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.strokeStyle = '#f0c800'; ctx.lineWidth = 1.8; ctx.setLineDash([7, 6]); ctx.stroke(); ctx.setLineDash([]);
      if (road.isCulDeSac) {
        const last = pts[pts.length - 1];
        if (!nodes.some(n => Math.hypot(n.x - last.x, n.y - last.y) < 20)) {
          ctx.beginPath();
          ctx.arc(last.x, last.y, 26, 0, Math.PI * 2);
          ctx.fillStyle = '#1c1c1c'; ctx.fill();
          ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 3; ctx.stroke();
        }
      }
      if (road.name) drawRoadSign(road);
    }
    function drawRoadSign(road) {
      const pts = road.points;
      const idx = Math.max(1, Math.floor(pts.length * 0.38));
      const p = pts[idx], p2 = pts[Math.min(idx + 1, pts.length - 1)];
      const dx = p2.x - p.x, dy = p2.y - p.y, len = Math.hypot(dx, dy) || 1;
      const ox = -dy / len * 22, oy = dx / len * 22;
      let sx = p.x + ox, sy = p.y + oy;
      if (nodes.some(n => Math.hypot(n.x - sx, n.y - sy) < 26)) { sx = p.x - ox; sy = p.y - oy; }
      const label = `${road.name.toUpperCase()} ${TYPE_FULL[road.type]||road.type}`;
      ctx.font = 'bold 11px Overpass';
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = '#2d6b2d'; ctx.strokeStyle = '#c9a800'; ctx.lineWidth = 1.5;
      const hw = tw/2 + 6, hh = 7;
      ctx.beginPath();
      ctx.moveTo(sx - hw + 2, sy - hh);
      ctx.lineTo(sx + hw - 2, sy - hh);
      ctx.quadraticCurveTo(sx + hw, sy - hh, sx + hw, sy - hh + 2);
      ctx.lineTo(sx + hw, sy + hh - 2);
      ctx.quadraticCurveTo(sx + hw, sy + hh, sx + hw - 2, sy + hh);
      ctx.lineTo(sx - hw + 2, sy + hh);
      ctx.quadraticCurveTo(sx - hw, sy + hh, sx - hw, sy + hh - 2);
      ctx.lineTo(sx - hw, sy - hh + 2);
      ctx.quadraticCurveTo(sx - hw, sy - hh, sx - hw + 2, sy - hh);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, sx, sy);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
    function drawNodes() {
      nodes.forEach(n => {
        ctx.beginPath(); ctx.arc(n.x, n.y, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#f5d000'; ctx.fill();
        ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(n.x, n.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#111'; ctx.fill();
      });
    }
    function draw() { drawGrass(); roads.forEach(drawRoad); drawNodes(); }
    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX - rect.left) * (MAP_W / rect.width), y: (e.clientY - rect.top) * (MAP_H / rect.height) };
    }
    function distToSeg(px, py, a, b) {
      const dx = b.x - a.x, dy = b.y - a.y, len2 = dx*dx + dy*dy;
      if (len2 === 0) return Math.hypot(px-a.x, py-a.y);
      let t = ((px-a.x)*dx + (py-a.y)*dy) / len2; t = Math.max(0, Math.min(1, t));
      return Math.hypot(px-(a.x+t*dx), py-(a.y+t*dy));
    }
    function findNearestRoad(mx, my, th = 16) {
      let best = null, bestD = th;
      for (const road of roads) {
        const pts = road.points;
        for (let i = 0; i < pts.length-1; i++) {
          const d = distToSeg(mx, my, pts[i], pts[i+1]);
          if (d < bestD) { bestD = d; best = road; }
        }
      }
      return best;
    }
    function findNearestNode(mx, my, th = 13) {
      let best = null, bestD = th;
      for (const n of nodes) {
        const d = Math.hypot(mx-n.x, my-n.y);
        if (d < bestD) { bestD = d; best = n; }
      }
      return best;
    }
    function roadsAtNode(id) { return roads.filter(r => r.nodeIds.includes(id)); }
    canvas.addEventListener('click', e => {
      const {x, y} = getMousePos(e);
      const node = findNearestNode(x, y);
      if (node) { openSign(node); return; }
      const road = findNearestRoad(x, y);
      if (road) openNameModal(road);
    });
    function openNameModal(road) {
      selectedRoadId = road.id;
      document.getElementById('streetName').value = road.name || '';
      document.getElementById('streetType').value = road.type || 'ST';
      document.getElementById('nameModal').classList.add('open');
      setTimeout(() => document.getElementById('streetName').focus(), 30);
    }
    document.getElementById('saveName').onclick = () => {
      const name = document.getElementById('streetName').value.trim();
      const type = document.getElementById('streetType').value;
      if (!name) return;
      const road = roads.find(r => r.id === selectedRoadId);
      if (road) { road.name = name; road.type = type; }
      document.getElementById('nameModal').classList.remove('open');
      draw();
      document.getElementById('status').textContent = `"${name} ${TYPE_FULL[type]}" named`;
    };
    document.getElementById('cancelName').onclick = () => document.getElementById('nameModal').classList.remove('open');
    function openSign(node) {
      currentSignRoads = roadsAtNode(node.id);
      if (!currentSignRoads.length) return;
      signOrder = [0, 1];
      updateSignBlades();
      document.getElementById('signOverlay').classList.add('open');
    }
    function updateSignBlades() {
      const top = currentSignRoads[signOrder[0]] || null;
      const bot = currentSignRoads[signOrder[1]] || currentSignRoads[0] || null;
      const fmt = r => !r ? '—' : (!r.name ? '(unnamed)' : `${r.name.toUpperCase()} ${TYPE_FULL[r.type]||r.type}`);
      document.getElementById('signTop').textContent = fmt(top);
      document.getElementById('signBottom').textContent = fmt(bot);
    }
    document.getElementById('btnReverse').onclick = () => {
      if (currentSignRoads.length < 2) return;
      signOrder = [signOrder[1], signOrder[0]];
      updateSignBlades();
    };
    document.getElementById('btnCloseSign').onclick = () => document.getElementById('signOverlay').classList.remove('open');
    document.querySelectorAll('.level-tabs button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.level-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadLevel(+btn.dataset.level);
      };
    });
    function loadLevel(lvl) {
      if (lvl === 1) generateLevel1();
      else if (lvl === 2) generateLevel2();
      else generateLevel3();
      const names = {1:'Cul-De-Sac', 2:'The Burbs', 3:'Lots & Blocks'};
      document.getElementById('status').textContent = `${names[lvl]} · ${nodes.length} intersections · v${VERSION}`;
      draw();
    }
    window.addEventListener('resize', resize);
    resize();
    loadLevel(1);
  </script>
</body>
</html>

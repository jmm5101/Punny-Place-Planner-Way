<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Punny Map Maker (Offline)</title>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --grass:#3d7a3a; --asphalt:#1c1c1c; --ui:#161616; --accent:#4caf50; --blue:#1a5fb4; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; font-family:'Overpass',system-ui,sans-serif; background:#0a0a0a; color:#eee; overflow:hidden; }
    body { display:flex; flex-direction:column; }
    header { background:var(--ui); border-bottom:2px solid #333; padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex-shrink:0; z-index:20; }
    h1 { font-size:0.95rem; font-weight:800; margin-right:8px; white-space:nowrap; }
    .btn { font-family:inherit; font-weight:600; font-size:0.75rem; padding:6px 10px; border:1.5px solid #444; background:#222; color:#ddd; border-radius:4px; cursor:pointer; white-space:nowrap; }
    .btn:hover { background:#2a2a2a; }
    .btn.active { background:var(--accent); border-color:#2e7d32; color:#000; }
    .btn.danger { border-color:#a33; color:#f88; }
    .btn.primary { background:var(--blue); border-color:#0d47a1; color:#fff; }
    .status { font-size:0.7rem; color:#888; margin-left:auto; }
    #wrap { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#1a3a1a; }
    canvas { display:block; image-rendering:pixelated; cursor:crosshair; background:var(--grass); box-shadow:0 0 30px rgba(0,0,0,0.5); }
    .panel { position:absolute; top:10px; right:10px; width:270px; background:rgba(20,20,20,0.95); border:1px solid #444; border-radius:8px; padding:12px; font-size:0.75rem; z-index:30; max-height:85%; overflow-y:auto; }
    .panel h3 { font-size:0.8rem; margin-bottom:8px; color:#aaa; }
    .panel label { display:block; margin:6px 0 2px; color:#999; }
    .panel input[type=number] { width:100%; padding:5px 7px; background:#111; border:1px solid #555; color:#fff; border-radius:3px; font-family:inherit; }
    .panel .row { display:flex; gap:6px; margin-top:8px; }
    .panel .row .btn { flex:1; text-align:center; }
    #exportBox { position:absolute; bottom:10px; left:10px; right:10px; background:rgba(0,0,0,0.85); border:1px solid #444; border-radius:6px; padding:8px; font-size:0.65rem; color:#8f8; max-height:120px; overflow:auto; display:none; white-space:pre-wrap; word-break:break-all; z-index:25; }
    .hint { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); color:#aaa; font-size:0.65rem; padding:4px 12px; border-radius:4px; pointer-events:none; z-index:10; }
  </style>
</head>
<body>
  <header>
    <h1>Map Maker</h1>
    <button class="btn active" id="btnDraw">Draw Road</button>
    <button class="btn" id="btnSelect">Select</button>
    <button class="btn" id="btnFinish">Finish Road</button>
    <button class="btn" id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="btnRedo" title="Redo (Ctrl+Y)">Redo</button>
    <button class="btn" id="btnCulDeSac">Cul-de-Sac</button>
    <button class="btn primary" id="btnExport">Export JSON</button>
    <button class="btn" id="btnLoad">Load JSON</button>
    <button class="btn danger" id="btnClear">Clear All</button>
    <span class="status" id="status">Click to place points for a new road</span>
  </header>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div class="panel">
      <h3>Selected Vertex</h3>
      <div id="noSel">Nothing selected</div>
      <div id="selInfo" style="display:none">
        <label>X</label><input type="number" id="vx" step="1" />
        <label>Y</label><input type="number" id="vy" step="1" />
        <label>Arc radius (0 = sharp)</label><input type="number" id="vr" step="5" min="0" value="0" />
        <p style="font-size:0.65rem;color:#777;margin:4px 0 0">True circular arc, tangent to both legs</p>
        <div class="row">
          <button class="btn" id="btnApply">Apply</button>
          <button class="btn danger" id="btnDelVert">Delete</button>
        </div>
      </div>
      <h3 style="margin-top:14px">Road List</h3>
      <div id="roadList" style="font-size:0.7rem;color:#bbb;max-height:180px;overflow-y:auto;"></div>
      <p style="font-size:0.65rem;color:#666;margin-top:10px">History: <span id="histCount">0</span> steps</p>
    </div>
    <div class="hint">True circular arcs · multi-step Undo/Redo · intersections auto-create nodes</div>
  </div>
  <div id="exportBox"></div>
  <script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap');
const MAP_W=720,MAP_H=1280;let scale=1;
let mode='draw',currentRoad=null,roads=[],selected=null,nextId=1;
const history=[],MAX_HIST=80;let histIndex=-1;
function snapshot(){return JSON.stringify({roads,currentRoad,nextId,selected});}
function pushHistory(){if(histIndex<history.length-1)history.length=histIndex+1;history.push(snapshot());if(history.length>MAX_HIST)history.shift();else histIndex++;document.getElementById('histCount').textContent=history.length;}
function restore(idx){if(idx<0||idx>=history.length)return;const d=JSON.parse(history[idx]);roads=d.roads||[];currentRoad=d.currentRoad;nextId=d.nextId||1;selected=d.selected;histIndex=idx;updateSelPanel();draw();document.getElementById('histCount').textContent=history.length;}
function undo(){if(histIndex>0)restore(histIndex-1);}
function redo(){if(histIndex<history.length-1)restore(histIndex+1);}
function resize(){const cw=wrap.clientWidth,ch=wrap.clientHeight;scale=Math.min(cw/MAP_W,ch/MAP_H)*0.96;canvas.width=MAP_W;canvas.height=MAP_H;canvas.style.width=Math.floor(MAP_W*scale)+'px';canvas.style.height=Math.floor(MAP_H*scale)+'px';draw();}
window.addEventListener('resize',resize);
function getPos(e){const r=canvas.getBoundingClientRect();return{x:Math.round((e.clientX-r.left)*(MAP_W/r.width)),y:Math.round((e.clientY-r.top)*(MAP_H/r.height))};}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function lineIntersection(p1,p2,p3,p4){const d=(p1.x-p2.x)*(p3.y-p4.y)-(p1.y-p2.y)*(p3.x-p4.x);if(Math.abs(d)<1e-9)return null;const t=((p1.x-p3.x)*(p3.y-p4.y)-(p1.y-p3.y)*(p3.x-p4.x))/d;const u=-((p1.x-p2.x)*(p1.y-p3.y)-(p1.y-p2.y)*(p1.x-p3.x))/d;if(t>0.01&&t<0.99&&u>0.01&&u<0.99)return{x:p1.x+t*(p2.x-p1.x),y:p1.y+t*(p2.y-p1.y)};return null;}
function computeFillet(A,B,C,R){
  if(!R||R<=0)return null;
  const d1x=A.x-B.x,d1y=A.y-B.y,len1=Math.hypot(d1x,d1y);if(len1<1e-6)return null;
  const u1x=d1x/len1,u1y=d1y/len1;
  const d2x=C.x-B.x,d2y=C.y-B.y,len2=Math.hypot(d2x,d2y);if(len2<1e-6)return null;
  const u2x=d2x/len2,u2y=d2y/len2;
  let cosA=u1x*u2x+u1y*u2y;cosA=Math.max(-1,Math.min(1,cosA));
  const angle=Math.acos(cosA);if(angle<0.05||angle>Math.PI-0.05)return null;
  const tanDist=R/Math.tan(angle/2);if(tanDist>len1-2||tanDist>len2-2)return null;
  const T1={x:B.x+u1x*tanDist,y:B.y+u1y*tanDist};
  const T2={x:B.x+u2x*tanDist,y:B.y+u2y*tanDist};
  let bx=u1x+u2x,by=u1y+u2y;const blen=Math.hypot(bx,by);if(blen<1e-6)return null;bx/=blen;by/=blen;
  const distCenter=R/Math.sin(angle/2);
  const cross=u1x*u2y-u1y*u2x;
  const cx=B.x+bx*distCenter,cy=B.y+by*distCenter;
  const startAngle=Math.atan2(T1.y-cy,T1.x-cx);
  const endAngle=Math.atan2(T2.y-cy,T2.x-cx);
  const clockwise=cross>0;
  return{cx,cy,r:R,T1,T2,startAngle,endAngle,clockwise,valid:true};
}
function computeIntersections(){
  const nodes=new Map();let nid=0;
  function getNode(x,y){const key=Math.round(x)+','+Math.round(y);if(!nodes.has(key))nodes.set(key,{id:nid++,x:Math.round(x),y:Math.round(y)});return nodes.get(key);}
  roads.forEach(r=>r.points.forEach(p=>getNode(p.x,p.y)));
  for(let i=0;i<roads.length;i++)for(let j=i+1;j<roads.length;j++){
    const A=roads[i].points,B=roads[j].points;
    for(let ai=0;ai<A.length-1;ai++)for(let bi=0;bi<B.length-1;bi++){
      const hit=lineIntersection(A[ai],A[ai+1],B[bi],B[bi+1]);if(hit)getNode(hit.x,hit.y);
    }
  }
  return Array.from(nodes.values());
}
function buildPath(pts){
  if(pts.length<2)return[];
  const cmds=[{type:'move',x:pts[0].x,y:pts[0].y}];
  let lastX=pts[0].x,lastY=pts[0].y;
  for(let i=1;i<pts.length;i++){
    const prev={x:lastX,y:lastY};
    const cur=pts[i];
    const next=pts[i+1];
    if(cur.r&&cur.r>0&&next){
      const f=computeFillet(prev,cur,next,cur.r);
      if(f&&f.valid){
        cmds.push({type:'line',x:f.T1.x,y:f.T1.y});
        cmds.push({type:'arc',cx:f.cx,cy:f.cy,r:f.r,start:f.startAngle,end:f.endAngle,clockwise:f.clockwise});
        lastX=f.T2.x;lastY=f.T2.y;
        continue;
      }
    }
    cmds.push({type:'line',x:cur.x,y:cur.y});
    lastX=cur.x;lastY=cur.y;
  }
  return cmds;
}
function strokePath(cmds,width,color,dash){
  if(!cmds.length)return;
  ctx.beginPath();
  for(const c of cmds){
    if(c.type==='move')ctx.moveTo(c.x,c.y);
    else if(c.type==='line')ctx.lineTo(c.x,c.y);
    else if(c.type==='arc')ctx.arc(c.cx,c.cy,c.r,c.start,c.end,c.clockwise);
  }
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';
  if(dash)ctx.setLineDash(dash);else ctx.setLineDash([]);
  ctx.stroke();ctx.setLineDash([]);
}
function drawGrass(){ctx.fillStyle='#3d7a3a';ctx.fillRect(0,0,MAP_W,MAP_H);ctx.fillStyle='rgba(0,0,0,0.04)';for(let i=0;i<180;i++)ctx.fillRect((i*67)%MAP_W,(i*43)%MAP_H,3,3);}
function drawRoad(road,isCurrent=false){
  const pts=road.points;
  if(pts.length<2){if(pts.length===1){ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,6,0,Math.PI*2);ctx.fillStyle=isCurrent?'#4caf50':'#f5d000';ctx.fill();}return;}
  const cmds=buildPath(pts);
  strokePath(cmds,20,'#0a0a0a');strokePath(cmds,14,'#1c1c1c');strokePath(cmds,1.6,'#f0c800',[6,5]);
  if(road.isCulDeSac&&pts.length>=2){const last=pts[pts.length-1];ctx.beginPath();ctx.arc(last.x,last.y,22,0,Math.PI*2);ctx.fillStyle='#1c1c1c';ctx.fill();ctx.strokeStyle='#0a0a0a';ctx.lineWidth=3;ctx.stroke();}
  pts.forEach((p,idx)=>{
    const isSel=selected&&selected.roadId===road.id&&selected.pointIdx===idx;
    ctx.beginPath();ctx.arc(p.x,p.y,isSel?9:6,0,Math.PI*2);ctx.fillStyle=isSel?'#4caf50':(isCurrent?'#8bc34a':'#f5d000');ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.stroke();
    if(p.r&&p.r>0){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.strokeStyle='rgba(255,200,0,0.25)';ctx.lineWidth=1;ctx.stroke();}
  });
}
function draw(){
  drawGrass();roads.forEach(r=>drawRoad(r,false));if(currentRoad)drawRoad(currentRoad,true);
  const nodes=computeIntersections();
  nodes.forEach(n=>{
    let already=false;
    roads.forEach(r=>r.points.forEach(p=>{if(Math.hypot(p.x-n.x,p.y-n.y)<8)already=true;}));
    if(currentRoad)currentRoad.points.forEach(p=>{if(Math.hypot(p.x-n.x,p.y-n.y)<8)already=true;});
    if(!already){ctx.beginPath();ctx.arc(n.x,n.y,7,0,Math.PI*2);ctx.fillStyle='#ff9800';ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.stroke();}
  });
  updateRoadList();
}
function updateRoadList(){
  const el=document.getElementById('roadList');
  if(!roads.length&&!currentRoad){el.innerHTML='<em>No roads yet</em>';return;}
  let html='';
  roads.forEach(r=>{html+=`<div style="margin:3px 0;padding:3px 0;border-bottom:1px solid #333">Road ${r.id} · ${r.points.length} pts ${r.isCulDeSac?'· CDS':''} <button class="btn" style="padding:2px 6px;font-size:0.65rem;margin-left:6px" data-sel="${r.id}">Sel</button></div>`;});
  if(currentRoad)html+=`<div style="margin:3px 0;color:#8bc34a">Current · ${currentRoad.points.length} pts</div>`;
  el.innerHTML=html;
  el.querySelectorAll('[data-sel]').forEach(b=>{b.onclick=()=>{const rid=+b.dataset.sel;const road=roads.find(r=>r.id===rid);if(road&&road.points.length){selected={roadId:rid,pointIdx:0};updateSelPanel();draw();}};});
}
function updateSelPanel(){
  const no=document.getElementById('noSel'),info=document.getElementById('selInfo');
  if(!selected){no.style.display='block';info.style.display='none';return;}
  no.style.display='none';info.style.display='block';
  const road=roads.find(r=>r.id===selected.roadId)||currentRoad;if(!road)return;
  const p=road.points[selected.pointIdx];
  document.getElementById('vx').value=p.x;document.getElementById('vy').value=p.y;document.getElementById('vr').value=p.r||0;
}
canvas.addEventListener('click',e=>{
  const pos=getPos(e);
  if(mode==='draw'){
    if(!currentRoad)currentRoad={id:nextId++,points:[],isCulDeSac:false,finished:false};
    currentRoad.points.push({x:pos.x,y:pos.y,r:0});pushHistory();
    document.getElementById('status').textContent=`Road ${currentRoad.id}: ${currentRoad.points.length} points · Finish when done`;
    draw();
  }else{
    let best=null,bestD=18;const all=[...roads];if(currentRoad)all.push(currentRoad);
    all.forEach(r=>r.points.forEach((p,idx)=>{const d=dist(p,pos);if(d<bestD){bestD=d;best={roadId:r.id,pointIdx:idx};}}));
    selected=best;updateSelPanel();draw();
  }
});
document.getElementById('btnDraw').onclick=()=>{mode='draw';document.getElementById('btnDraw').classList.add('active');document.getElementById('btnSelect').classList.remove('active');document.getElementById('status').textContent='Draw mode: click to place points';};
document.getElementById('btnSelect').onclick=()=>{mode='select';document.getElementById('btnSelect').classList.add('active');document.getElementById('btnDraw').classList.remove('active');document.getElementById('status').textContent='Select mode: click a vertex to set arc radius';};
document.getElementById('btnFinish').onclick=()=>{if(currentRoad&&currentRoad.points.length>=2){currentRoad.finished=true;roads.push(currentRoad);currentRoad=null;pushHistory();document.getElementById('status').textContent=`Road finished. Total: ${roads.length}`;draw();}else document.getElementById('status').textContent='Need at least 2 points';};
document.getElementById('btnUndo').onclick=undo;document.getElementById('btnRedo').onclick=redo;
document.getElementById('btnCulDeSac').onclick=()=>{if(selected){const road=roads.find(r=>r.id===selected.roadId);if(road){road.isCulDeSac=!road.isCulDeSac;pushHistory();draw();}}else if(currentRoad){currentRoad.isCulDeSac=!currentRoad.isCulDeSac;pushHistory();draw();}else document.getElementById('status').textContent='Select a road first';};
document.getElementById('btnClear').onclick=()=>{if(confirm('Clear all roads?')){roads=[];currentRoad=null;selected=null;nextId=1;pushHistory();draw();}};
document.getElementById('btnApply').onclick=()=>{if(!selected)return;const road=roads.find(r=>r.id===selected.roadId)||currentRoad;if(!road)return;const p=road.points[selected.pointIdx];p.x=+document.getElementById('vx').value;p.y=+document.getElementById('vy').value;p.r=+document.getElementById('vr').value||0;pushHistory();draw();};
document.getElementById('btnDelVert').onclick=()=>{if(!selected)return;const road=roads.find(r=>r.id===selected.roadId)||currentRoad;if(!road||road.points.length<=2)return;road.points.splice(selected.pointIdx,1);selected=null;pushHistory();updateSelPanel();draw();};
function buildExport(){
  const nodes=computeIntersections();const nodeMap=new Map();nodes.forEach(n=>nodeMap.set(n.x+','+n.y,n));
  const exportRoads=roads.map(r=>{const nodeIds=[];r.points.forEach(p=>{const key=Math.round(p.x)+','+Math.round(p.y);if(nodeMap.has(key))nodeIds.push(nodeMap.get(key).id);});return{id:r.id,name:'',type:'ST',points:r.points.map(p=>({x:p.x,y:p.y,r:p.r||0})),nodeIds,isCulDeSac:!!r.isCulDeSac};});
  return{version:2,mapWidth:MAP_W,mapHeight:MAP_H,nodes,roads:exportRoads,note:'r values are true circular arc radii (tangent fillets)'};
}
document.getElementById('btnExport').onclick=()=>{if(!roads.length){alert('Finish at least one road first');return;}const data=buildExport();const json=JSON.stringify(data,null,2);const box=document.getElementById('exportBox');box.style.display='block';box.textContent=json;const blob=new Blob([json],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='punny-map.json';a.click();document.getElementById('status').textContent='Exported · send the JSON to Grok for the game';};
document.getElementById('btnLoad').onclick=()=>{const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);roads=(data.roads||[]).map(r=>({id:r.id,points:r.points.map(p=>({x:p.x,y:p.y,r:p.r||0})),isCulDeSac:!!r.isCulDeSac,finished:true}));nextId=Math.max(1,...roads.map(r=>r.id))+1;currentRoad=null;selected=null;pushHistory();draw();document.getElementById('status').textContent=`Loaded ${roads.length} roads`;}catch(err){alert('Invalid JSON');}};reader.readAsText(file);};input.click();};
window.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btnFinish').click();if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){e.preventDefault();redo();}if(e.key==='Escape'){currentRoad=null;selected=null;updateSelPanel();draw();}});
pushHistory();resize();draw();
  </script>
</body>
</html>

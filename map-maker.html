<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Punny Map Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Overpass,system-ui,sans-serif;background:#111;color:#eee;overflow:hidden}
body{display:flex;flex-direction:column}
header{background:#1a1a1a;border-bottom:2px solid #333;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex-shrink:0}
.btn{font-family:inherit;font-size:.72rem;font-weight:600;padding:6px 10px;border:1.5px solid #555;background:#2a2a2a;color:#ddd;border-radius:4px;cursor:pointer}
.btn:hover{background:#333}
.btn.active{background:#2e7d32;border-color:#4caf50;color:#fff}
.btn.primary{background:#1565c0;border-color:#1976d2;color:#fff}
.btn.danger{background:#5c1a1a;border-color:#c62828}
.btn.mark{background:#6a4c00;border-color:#f9a825;color:#ffe082}
.btn.mark.active{background:#f9a825;color:#111}
.status{font-size:.7rem;color:#aaa;margin-left:8px;flex:1;min-width:140px}
#wrap{flex:1;position:relative;overflow:hidden;background:#1a3a1a}
canvas{display:block;cursor:crosshair;image-rendering:pixelated}
.panel{position:absolute;top:8px;right:8px;width:200px;background:rgba(20,20,20,.92);border:1px solid #444;border-radius:6px;padding:10px;font-size:.75rem;z-index:10}
.panel h3{font-size:.8rem;margin-bottom:6px;color:#8bc34a}
.panel label{display:block;color:#888;margin-top:6px;font-size:.65rem}
.panel input{width:100%;padding:4px;background:#111;border:1px solid #555;color:#eee;border-radius:3px;font-family:inherit}
.panel .row{display:flex;gap:4px;margin-top:8px}
.panel .row .btn{flex:1;padding:5px}
#exportBox{position:absolute;bottom:0;left:0;right:0;max-height:28%;overflow:auto;background:#0a0a0a;border-top:2px solid #333;padding:8px;font-family:monospace;font-size:.6rem;color:#8f8;display:none;white-space:pre-wrap;z-index:20}
.hint{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.75);color:#aaa;font-size:.6rem;padding:4px 8px;border-radius:3px;pointer-events:none;z-index:5}
#roadList{max-height:120px;overflow:auto;margin-top:6px}
.road-item{padding:3px 6px;cursor:pointer;border-radius:3px;font-size:.7rem}
.road-item:hover,.road-item.sel{background:#2e7d32}
</style>
</head>
<body>
<header>
<button class="btn active" id="btnDraw">Draw Road</button>
<button class="btn" id="btnSelect">Select</button>
<button class="btn mark" id="btnMark">Mark Intersection</button>
<button class="btn" id="btnFinish">Finish Road</button>
<button class="btn" id="btnUndo">Undo</button>
<button class="btn" id="btnCulDeSac">Cul-de-Sac</button>
<button class="btn primary" id="btnExport">Export JSON</button>
<button class="btn" id="btnLoad">Load JSON</button>
<button class="btn danger" id="btnClear">Clear</button>
<span class="status" id="status">Draw: click points · Finish Road when done</span>
</header>
<div id="wrap">
<canvas id="c"></canvas>
<div class="panel" id="panel">
<h3>Roads</h3>
<div id="roadList"></div>
<h3 style="margin-top:10px">Selected Vertex</h3>
<div id="noSel">Nothing selected</div>
<div id="selInfo" style="display:none">
<label>X</label><input type="number" id="vx" step="1"/>
<label>Y</label><input type="number" id="vy" step="1"/>
<label>Curve radius (0 = sharp)</label><input type="number" id="vr" step="5" min="0" value="0"/>
<div class="row">
<button class="btn primary" id="btnApply">Apply</button>
<button class="btn danger" id="btnDelVert">Delete</button>
</div>
</div>
<h3 style="margin-top:10px">Intersections</h3>
<div id="ixList" style="font-size:.65rem;color:#ccc">None yet — use Mark Intersection</div>
</div>
<div class="hint">Mark Intersection: click first road, then second · node at closest approach</div>
</div>
<div id="exportBox"></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const MAP_W=720,MAP_H=1280;
let roads=[],current=null,mode='draw',selected=null,markFirst=null;
let intersections=[],history=[],MAX_HISTORY=80,nextRoadId=1,nextIxId=1;
function saveHistory(){history.push(JSON.stringify({roads,intersections,nextRoadId,nextIxId,current}));if(history.length>MAX_HISTORY)history.shift();}
function undo(){if(!history.length)return;const s=JSON.parse(history.pop());roads=s.roads;intersections=s.intersections;nextRoadId=s.nextRoadId;nextIxId=s.nextIxId;current=s.current;selected=null;markFirst=null;updateRoadList();updateIxList();draw();document.getElementById('status').textContent='Undone';}
function resize(){const wrap=document.getElementById('wrap');const scale=Math.min(wrap.clientWidth/MAP_W,wrap.clientHeight/MAP_H)*0.98;canvas.width=MAP_W;canvas.height=MAP_H;canvas.style.width=Math.floor(MAP_W*scale)+'px';canvas.style.height=Math.floor(MAP_H*scale)+'px';draw();}
function getPos(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left)*(MAP_W/rect.width),y:(e.clientY-rect.top)*(MAP_H/rect.height)};}
function distToSeg(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;if(len2===0)return{d:Math.hypot(px-a.x,py-a.y),cx:a.x,cy:a.y};let t=((px-a.x)*dx+(py-a.y)*dy)/len2;t=Math.max(0,Math.min(1,t));const cx=a.x+t*dx,cy=a.y+t*dy;return{d:Math.hypot(px-cx,py-cy),cx,cy};}
function closestOnRoad(px,py,road){let best={d:Infinity,cx:px,cy:py};const pts=road.points;for(let i=0;i<pts.length-1;i++){const r=distToSeg(px,py,pts[i],pts[i+1]);if(r.d<best.d)best=r;}return best;}
function findNearestRoad(mx,my,th=18){let best=null,bestD=th;for(const r of roads){for(let i=0;i<r.points.length-1;i++){const d=distToSeg(mx,my,r.points[i],r.points[i+1]).d;if(d<bestD){bestD=d;best=r;}}}return best;}
function findNearestVertex(mx,my,th=14){let best=null,bestD=th;roads.forEach((r,ri)=>{r.points.forEach((p,pi)=>{const d=Math.hypot(mx-p.x,my-p.y);if(d<bestD){bestD=d;best={roadIdx:ri,ptIdx:pi};}});});return best;}
function computeFillet(A,B,C,R){if(!R||R<=0)return null;const d1x=A.x-B.x,d1y=A.y-B.y,len1=Math.hypot(d1x,d1y);if(len1<1e-6)return null;const u1x=d1x/len1,u1y=d1y/len1;const d2x=C.x-B.x,d2y=C.y-B.y,len2=Math.hypot(d2x,d2y);if(len2<1e-6)return null;const u2x=d2x/len2,u2y=d2y/len2;let cosA=u1x*u2x+u1y*u2y;cosA=Math.max(-1,Math.min(1,cosA));const angle=Math.acos(cosA);if(angle<0.05||angle>Math.PI-0.05)return null;const tanDist=R/Math.tan(angle/2);if(tanDist>len1-2||tanDist>len2-2)return null;const T1={x:B.x+u1x*tanDist,y:B.y+u1y*tanDist};const T2={x:B.x+u2x*tanDist,y:B.y+u2y*tanDist};let bx=u1x+u2x,by=u1y+u2y;const blen=Math.hypot(bx,by);if(blen<1e-6)return null;bx/=blen;by/=blen;const distCenter=R/Math.sin(angle/2);const cross=u1x*u2y-u1y*u2x;const cx=B.x+bx*distCenter,cy=B.y+by*distCenter;return{cx,cy,r:R,T1,T2,startAngle:Math.atan2(T1.y-cy,T1.x-cx),endAngle:Math.atan2(T2.y-cy,T2.x-cx),clockwise:cross>0,valid:true};}
function buildPath(pts){if(pts.length<2)return[];const cmds=[{type:'move',x:pts[0].x,y:pts[0].y}];let lastX=pts[0].x,lastY=pts[0].y;for(let i=1;i<pts.length;i++){const prev={x:lastX,y:lastY},cur=pts[i],next=pts[i+1];if(cur.r&&cur.r>0&&next){const f=computeFillet(prev,cur,next,cur.r);if(f&&f.valid){cmds.push({type:'line',x:f.T1.x,y:f.T1.y});cmds.push({type:'arc',cx:f.cx,cy:f.cy,r:f.r,start:f.startAngle,end:f.endAngle,clockwise:f.clockwise});lastX=f.T2.x;lastY=f.T2.y;continue;}}cmds.push({type:'line',x:cur.x,y:cur.y});lastX=cur.x;lastY=cur.y;}return cmds;}
function strokePath(cmds,w,col,dash){if(!cmds.length)return;ctx.beginPath();for(const c of cmds){if(c.type==='move')ctx.moveTo(c.x,c.y);else if(c.type==='line')ctx.lineTo(c.x,c.y);else if(c.type==='arc')ctx.arc(c.cx,c.cy,c.r,c.start,c.end,c.clockwise);}ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';if(dash)ctx.setLineDash(dash);else ctx.setLineDash([]);ctx.stroke();ctx.setLineDash([]);}
function drawGrass(){ctx.fillStyle='#3d7a3a';ctx.fillRect(0,0,MAP_W,MAP_H);ctx.fillStyle='rgba(0,0,0,0.04)';for(let i=0;i<200;i++)ctx.fillRect((i*67)%MAP_W,(i*43)%MAP_H,3,3);}
function drawRoad(road,highlight){const pts=road.points;if(pts.length<2){if(pts.length===1){ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,5,0,Math.PI*2);ctx.fillStyle=highlight?'#ffeb3b':'#fff';ctx.fill();}return;}const cmds=buildPath(pts);strokePath(cmds,18,highlight?'#5d4037':'#0a0a0a');strokePath(cmds,12,highlight?'#8d6e63':'#1c1c1c');strokePath(cmds,1.4,'#f0c800',[5,4]);if(road.isCulDeSac){const last=pts[pts.length-1];ctx.beginPath();ctx.arc(last.x,last.y,18,0,Math.PI*2);ctx.fillStyle='#1c1c1c';ctx.fill();ctx.strokeStyle='#0a0a0a';ctx.lineWidth=2;ctx.stroke();}pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle=(selected&&selected.roadIdx===roads.indexOf(road)&&selected.ptIdx===i)?'#ffeb3b':'#aaa';ctx.fill();});}
function draw(){drawGrass();roads.forEach(r=>{const hi=(mode==='mark'&&markFirst&&markFirst===r.id)||(selected&&roads[selected.roadIdx]===r);drawRoad(r,hi);});if(current)drawRoad(current,true);intersections.forEach(ix=>{ctx.beginPath();ctx.arc(ix.x,ix.y,9,0,Math.PI*2);ctx.fillStyle='#f5d000';ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(ix.x,ix.y,3.5,0,Math.PI*2);ctx.fillStyle='#111';ctx.fill();});}
function updateRoadList(){const el=document.getElementById('roadList');el.innerHTML=roads.map((r,i)=>`<div class="road-item" data-i="${i}">Road ${r.id} (${r.points.length} pts)${r.isCulDeSac?' CDS':''}</div>`).join('')||'<div style="color:#666">No roads yet</div>';el.querySelectorAll('.road-item').forEach(b=>{b.onclick=()=>{selected={roadIdx:+b.dataset.i,ptIdx:0};updateSelPanel();draw();};});}
function updateIxList(){const el=document.getElementById('ixList');if(!intersections.length){el.innerHTML='None yet — use Mark Intersection';return;}el.innerHTML=intersections.map(ix=>`<div style="margin:2px 0">#${ix.id} roads [${ix.roadIds.join(',')}] @ (${ix.x},${ix.y}) <button data-id="${ix.id}" class="btn danger" style="padding:1px 4px;font-size:.6rem">×</button></div>`).join('');el.querySelectorAll('button').forEach(b=>{b.onclick=()=>{saveHistory();intersections=intersections.filter(x=>x.id!==+b.dataset.id);updateIxList();draw();};});}
function updateSelPanel(){if(!selected||!roads[selected.roadIdx]){document.getElementById('noSel').style.display='block';document.getElementById('selInfo').style.display='none';return;}const p=roads[selected.roadIdx].points[selected.ptIdx];document.getElementById('noSel').style.display='none';document.getElementById('selInfo').style.display='block';document.getElementById('vx').value=Math.round(p.x);document.getElementById('vy').value=Math.round(p.y);document.getElementById('vr').value=p.r||0;}
document.getElementById('btnDraw').onclick=()=>{mode='draw';markFirst=null;document.querySelectorAll('header .btn').forEach(b=>b.classList.remove('active'));document.getElementById('btnDraw').classList.add('active');document.getElementById('status').textContent='Draw: click to place points · Finish Road when done';};
document.getElementById('btnSelect').onclick=()=>{mode='select';markFirst=null;document.querySelectorAll('header .btn').forEach(b=>b.classList.remove('active'));document.getElementById('btnSelect').classList.add('active');document.getElementById('status').textContent='Select: click a vertex';};
document.getElementById('btnMark').onclick=()=>{mode='mark';markFirst=null;selected=null;document.querySelectorAll('header .btn').forEach(b=>b.classList.remove('active'));document.getElementById('btnMark').classList.add('active');document.getElementById('status').textContent='Mark Intersection: click the FIRST road';draw();};
document.getElementById('btnFinish').onclick=()=>{if(!current||current.points.length<2){document.getElementById('status').textContent='Need at least 2 points';return;}saveHistory();roads.push({id:nextRoadId++,points:current.points.map(p=>({...p})),isCulDeSac:!!current.isCulDeSac});current=null;updateRoadList();draw();document.getElementById('status').textContent=`Road ${nextRoadId-1} finished · ${roads.length} roads`;};
document.getElementById('btnUndo').onclick=()=>{if(mode==='draw'&&current&&current.points.length){current.points.pop();if(!current.points.length)current=null;draw();return;}undo();};
document.getElementById('btnCulDeSac').onclick=()=>{if(selected&&roads[selected.roadIdx]){saveHistory();roads[selected.roadIdx].isCulDeSac=!roads[selected.roadIdx].isCulDeSac;updateRoadList();draw();}else if(current){current.isCulDeSac=!current.isCulDeSac;draw();}};
document.getElementById('btnClear').onclick=()=>{if(!confirm('Clear all?'))return;saveHistory();roads=[];intersections=[];current=null;selected=null;markFirst=null;nextRoadId=1;nextIxId=1;updateRoadList();updateIxList();draw();};
document.getElementById('btnApply').onclick=()=>{if(!selected)return;saveHistory();const p=roads[selected.roadIdx].points[selected.ptIdx];p.x=+document.getElementById('vx').value;p.y=+document.getElementById('vy').value;p.r=+document.getElementById('vr').value||0;draw();};
document.getElementById('btnDelVert').onclick=()=>{if(!selected)return;const r=roads[selected.roadIdx];if(r.points.length<=2){saveHistory();roads.splice(selected.roadIdx,1);selected=null;}else{saveHistory();r.points.splice(selected.ptIdx,1);selected.ptIdx=Math.min(selected.ptIdx,r.points.length-1);}updateRoadList();updateSelPanel();draw();};
canvas.addEventListener('click',e=>{const pos=getPos(e);if(mode==='draw'){if(!current)current={points:[],isCulDeSac:false};current.points.push({x:Math.round(pos.x),y:Math.round(pos.y),r:0});draw();document.getElementById('status').textContent=`Point ${current.points.length} · Finish Road when done`;return;}if(mode==='select'){selected=findNearestVertex(pos.x,pos.y);updateSelPanel();draw();return;}if(mode==='mark'){const road=findNearestRoad(pos.x,pos.y,22);if(!road){document.getElementById('status').textContent='No road near click — try again';return;}if(!markFirst){markFirst=road.id;document.getElementById('status').textContent=`First road #${road.id} selected · now click the SECOND road`;draw();return;}if(markFirst===road.id){document.getElementById('status').textContent='Pick a different road';return;}const r1=roads.find(r=>r.id===markFirst),r2=road;let best={d:Infinity,x:0,y:0};for(let i=0;i<r1.points.length-1;i++){const a=r1.points[i],b=r1.points[i+1];for(let t=0;t<=1;t+=0.05){const px=a.x+(b.x-a.x)*t,py=a.y+(b.y-a.y)*t;const cp=closestOnRoad(px,py,r2);if(cp.d<best.d)best={d:cp.d,x:(px+cp.cx)/2,y:(py+cp.cy)/2};}}[r1.points[0],r1.points[r1.points.length-1]].forEach(p=>{const cp=closestOnRoad(p.x,p.y,r2);if(cp.d<best.d)best={d:cp.d,x:(p.x+cp.cx)/2,y:(p.y+cp.cy)/2};});[r2.points[0],r2.points[r2.points.length-1]].forEach(p=>{const cp=closestOnRoad(p.x,p.y,r1);if(cp.d<best.d)best={d:cp.d,x:(p.x+cp.cx)/2,y:(p.y+cp.cy)/2};});saveHistory();intersections.push({id:nextIxId++,x:Math.round(best.x),y:Math.round(best.y),roadIds:[markFirst,r2.id]});markFirst=null;updateIxList();draw();document.getElementById('status').textContent=`Intersection #${nextIxId-1} created · click first road for another`;}});
function buildExport(){const nodes=intersections.map(ix=>({id:ix.id,x:ix.x,y:ix.y}));const exportRoads=roads.map(r=>{const nodeIds=intersections.filter(ix=>ix.roadIds.includes(r.id)).map(ix=>ix.id);return{id:r.id,name:'',type:'ST',points:r.points.map(p=>({x:p.x,y:p.y,r:p.r||0})),nodeIds,isCulDeSac:!!r.isCulDeSac};});return{version:3,mapWidth:MAP_W,mapHeight:MAP_H,nodes,roads:exportRoads,intersections:intersections.map(ix=>({id:ix.id,x:ix.x,y:ix.y,roadIds:ix.roadIds.slice()})),note:'Intersections are manually marked. r values are true circular arc radii.'};}
document.getElementById('btnExport').onclick=()=>{const data=buildExport();const json=JSON.stringify(data,null,2);const box=document.getElementById('exportBox');box.style.display='block';box.textContent=json;const blob=new Blob([json],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='punny-map.json';a.click();document.getElementById('status').textContent=`Exported ${roads.length} roads, ${intersections.length} intersections`;};
document.getElementById('btnLoad').onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{const text=await inp.files[0].text();try{const data=JSON.parse(text);saveHistory();roads=(data.roads||[]).map(r=>({id:r.id,points:r.points.map(p=>({x:p.x,y:p.y,r:p.r||0})),isCulDeSac:!!r.isCulDeSac}));intersections=(data.intersections||[]).map(n=>({id:n.id,x:n.x,y:n.y,roadIds:n.roadIds||[]}));nextRoadId=Math.max(1,...roads.map(r=>r.id+1),1);nextIxId=Math.max(1,...intersections.map(i=>i.id+1),1);current=null;selected=null;markFirst=null;updateRoadList();updateIxList();draw();document.getElementById('status').textContent=`Loaded ${roads.length} roads, ${intersections.length} intersections`;}catch(err){alert('Invalid JSON: '+err.message);}};inp.click();};
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();document.getElementById('btnUndo').click();}});window.addEventListener('resize',resize);resize();updateRoadList();updateIxList();
</script>
</body>
</html>
